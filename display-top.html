<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top Scoreboard Display</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;800&display=swap');
    :root { --navy:#061643; --blue:#123ca6; --blue-bright:#1a55d6; --red:#ed1745; --yellow:#ffd447; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
    body { font-family:'Kanit',sans-serif; color:#fff; }
    .scoreboard {
      position:absolute; top:9%; left:28px; display:flex; align-items:stretch;
      height:58px; filter:drop-shadow(0 5px 7px rgba(0,0,0,.4));
      animation:scoreboard-in .45s cubic-bezier(.2,.85,.25,1) both;
    }
    @keyframes scoreboard-in { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:translateX(0); } }
    .period {
      position:absolute; left:50%; bottom:calc(100% + 4px); z-index:2; transform:translateX(-50%);
      display:flex; align-items:center; justify-content:center; min-width:86px; height:22px; padding:0 9px;
      background:linear-gradient(135deg,var(--navy),var(--blue)); border-left:3px solid var(--red);
      font-size:11px; line-height:1; font-weight:600; letter-spacing:.35px; white-space:nowrap;
      box-shadow:0 3px 5px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.15);
    }
    .time-wrap {
      position:absolute; left:50%; top:calc(100% + 4px); z-index:2; transform:translateX(-50%);
      display:flex; flex-direction:row; align-items:center; justify-content:center; gap:7px;
      min-width:116px; min-height:42px; padding:6px 11px; background:linear-gradient(135deg,var(--navy),#12327f); color:#fff;
      border-top:3px solid var(--red); box-shadow:0 3px 5px rgba(0,0,0,.3);
    }
    .timer { font-size:20px; font-weight:800; line-height:1; letter-spacing:.8px; font-variant-numeric:tabular-nums; }
    .added-time {
      display:none; align-items:center; justify-content:center; min-width:44px; height:31px; padding:0 9px;
      border-radius:4px; background:var(--yellow); color:#07102e; font-size:20px; font-weight:800; line-height:1;
      box-shadow:0 0 0 2px rgba(255,255,255,.22),0 2px 5px rgba(0,0,0,.3);
    }
    .team {
      display:flex; align-items:center; gap:8px; min-width:155px; max-width:245px; padding:0 12px;
      position:relative; overflow:visible; background:linear-gradient(110deg,var(--navy),var(--blue)); border-bottom:4px solid var(--red);
      box-shadow:inset 0 1px rgba(255,255,255,.16),inset 0 -8px 16px rgba(0,0,0,.14);
    }
    .team::after { content:""; position:absolute; inset:0; opacity:.14; background:linear-gradient(120deg,transparent 30%,#fff 31%,transparent 34% 75%,#7fa2ff 76%,transparent 78%); }
    .team-logo { position:relative; z-index:2; width:42px; height:42px; padding:3px; object-fit:contain; border:2px solid #fff; border-radius:50%; background:#f7f9ff; box-shadow:0 0 0 2px var(--blue),0 2px 5px rgba(0,0,0,.35); }
    .team-name { position:relative; z-index:2; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; font-weight:600; letter-spacing:.35px; text-shadow:0 2px 2px rgba(0,0,0,.28); text-transform:uppercase; }
    .discipline { position:absolute; z-index:8; top:-22px; display:flex; gap:4px; }
    .home .discipline { left:8px; }
    .away .discipline { right:8px; }
    .discipline-badge { display:none; align-items:center; gap:3px; height:19px; padding:2px 5px; border-radius:3px; background:#07102e; font:800 11px Arial,sans-serif; box-shadow:0 2px 4px rgba(0,0,0,.35); }
    .discipline-badge::before { content:""; width:7px; height:12px; border-radius:1px; }
    .discipline-badge.yellow::before { background:#facc15; }
    .discipline-badge.red::before { background:#ef3340; }
    .score {
      display:flex; align-items:center; justify-content:center; width:58px; min-width:58px; padding:0 3px;
      background:linear-gradient(#fff,#e9edf5); color:#07102e; font-size:36px; line-height:1; font-weight:800;
      box-shadow:inset 0 0 0 1px rgba(5,15,50,.14),inset 0 -5px 10px rgba(4,17,55,.06);
      overflow:hidden;
    }
    .score-center { position:relative; display:flex; align-self:stretch; }
    .score-center::after { content:""; position:absolute; z-index:2; left:50%; top:10px; bottom:10px; width:1px; background:#b7becb; }
    .away { flex-direction:row-reverse; }
    .away .team-name { text-align:right; }
    .goal-alert {
      position:absolute; z-index:30; inset:0; width:100%; transform:none;
      display:flex; align-items:center; justify-content:center; gap:12px;
      min-width:0; height:58px; padding:0 36px; opacity:0; pointer-events:none;
      overflow:hidden;
      background:linear-gradient(105deg,#07185d,#164bd0 42%,#7719b8 76%,#151066);
      border-block:2px solid rgba(255,255,255,.85); filter:drop-shadow(0 5px 8px rgba(0,0,0,.45));
    }
    .goal-alert::after {
      content:""; position:absolute; inset:-35%; z-index:1;
      background:
        radial-gradient(circle at 25% 50%,rgba(9,206,255,.65),transparent 24%),
        radial-gradient(circle at 76% 48%,rgba(246,28,199,.72),transparent 28%),
        repeating-linear-gradient(58deg,rgba(255,255,255,.3) 0 2px,transparent 2px 25px),
        repeating-linear-gradient(-58deg,rgba(255,255,255,.24) 0 2px,transparent 2px 29px);
      transform-origin:50% 15%;
      animation:goal-net .38s ease-in-out infinite alternate;
    }
    .goal-alert::before {
      content:""; position:absolute; z-index:4; top:-15%; bottom:-15%; left:-38%; width:38%;
      background:linear-gradient(100deg,transparent 0 8%,rgba(255,255,255,.88) 20%,#fff 48%,rgba(215,228,255,.9) 72%,transparent 92%);
      box-shadow:20px 0 26px rgba(255,255,255,.65); opacity:0; transform:skewX(-12deg); pointer-events:none;
    }
    .goal-title { position:relative; z-index:2; font-family:Arial Black,Arial,sans-serif; font-size:34px; line-height:1; font-weight:900; letter-spacing:-1px; text-shadow:0 3px 7px rgba(0,0,0,.45); }
    .goal-alert.play { animation:goal-top 2.8s cubic-bezier(.3,.75,.2,1) both; }
    .goal-alert.play::before { animation:goal-beam 2.8s ease-in-out both; }
    .goal-alert.play .goal-title { animation:goal-word 2.8s ease-in-out both; }
    @keyframes goal-top {
      0% { opacity:1; clip-path:inset(0 100% 0 0); }
      30%,72% { opacity:1; clip-path:inset(0 0 0 0); }
      100% { opacity:1; clip-path:inset(0 100% 0 0); }
    }
    @keyframes goal-beam { 0% { left:-38%; opacity:0; } 5% { opacity:1; } 30% { left:100%; opacity:1; } 34%,70% { opacity:0; } 74% { left:100%; opacity:1; } 96% { opacity:1; } 100% { left:-38%; opacity:0; } }
    @keyframes goal-word { 0%,8% { opacity:0; clip-path:inset(0 100% 0 0); } 35%,72% { opacity:1; clip-path:inset(0 0 0 0); } 100% { opacity:0; clip-path:inset(0 100% 0 0); } }
    @keyframes goal-net { from { transform:perspective(360px) rotateX(8deg) translateX(-4px) scale(1.01); } to { transform:perspective(360px) rotateX(-5deg) translateX(4px) scale(1.08,1.14); } }
  </style>
</head>
<body>
  <div class="scoreboard">
    <div id="goal-alert" class="goal-alert"><span class="goal-title">GOAL</span></div>
    <div class="team home">
      <img id="home-logo" class="team-logo" alt="Home logo">
      <span id="home-name" class="team-name">HOME</span>
      <div class="discipline"><span id="home-yellow" class="discipline-badge yellow"></span><span id="home-red" class="discipline-badge red"></span></div>
    </div>
    <div class="score-center">
      <div id="period" class="period">FIRST HALF</div>
      <div id="home-score" class="score">0</div>
      <div id="away-score" class="score">0</div>
      <div class="time-wrap">
        <div id="timer" class="timer">00:00</div>
        <div id="added-time" class="added-time"></div>
      </div>
    </div>
    <div class="team away">
      <img id="away-logo" class="team-logo" alt="Away logo">
      <span id="away-name" class="team-name">AWAY</span>
      <div class="discipline"><span id="away-yellow" class="discipline-badge yellow"></span><span id="away-red" class="discipline-badge red"></span></div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('football_scoreboard');
    const blankLogo = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23071d68'/%3E%3Cpath d='M50 20l9 18 20 3-14 14 3 20-18-9-18 9 3-20-14-14 20-3z' fill='white'/%3E%3C/svg%3E";
    document.getElementById('home-logo').src = blankLogo;
    document.getElementById('away-logo').src = blankLogo;
    let lastScores = null;
    let goalTimer = null;

    function showGoal() {
      const alert = document.getElementById('goal-alert');
      alert.classList.remove('play');
      void alert.offsetWidth;
      alert.classList.add('play');
      clearTimeout(goalTimer);
      goalTimer = setTimeout(() => alert.classList.remove('play'), 2900);
    }

    function render(data) {
      if (!data || data.type === 'request-state') return;
      const nextScores = [Number(data.homeScore) || 0, Number(data.awayScore) || 0];
      if (lastScores) {
        if (nextScores[0] > lastScores[0]) showGoal(data.homeName);
        else if (nextScores[1] > lastScores[1]) showGoal(data.awayName);
      }
      lastScores = nextScores;
      const setText = (id, value) => {
        if (value !== undefined) document.getElementById(id).textContent = value;
      };
      setText('period', data.period || 'FIRST HALF');
      setText('timer', data.timer);
      setText('home-name', data.homeName);
      setText('away-name', data.awayName);
      setText('home-score', data.homeScore);
      setText('away-score', data.awayScore);
      if (data.homeLogo) document.getElementById('home-logo').src = data.homeLogo;
      if (data.awayLogo) document.getElementById('away-logo').src = data.awayLogo;
      [['home-yellow', data.homeYellow], ['home-red', data.homeRed], ['away-yellow', data.awayYellow], ['away-red', data.awayRed]].forEach(([id, value]) => {
        const badge = document.getElementById(id);
        const count = Math.max(0, Number(value) || 0);
        badge.textContent = count;
        badge.style.display = count > 0 ? 'inline-flex' : 'none';
      });

      const added = document.getElementById('added-time');
      const showAdded = Boolean(data.showAddedTime) && data.addedTime !== '';
      added.textContent = showAdded ? `+${data.addedTime}′` : '';
      added.style.display = showAdded ? 'inline-flex' : 'none';
    }

    channel.onmessage = event => render(event.data);
    window.addEventListener('storage', event => {
      if (event.key === 'football_scoreboard_state' && event.newValue) {
        try { render(JSON.parse(event.newValue)); } catch (_) {}
      }
    });
    try { render(JSON.parse(localStorage.getItem('football_scoreboard_state'))); } catch (_) {}
    channel.postMessage({type:'request-state'});
  </script>
</body>
</html>
